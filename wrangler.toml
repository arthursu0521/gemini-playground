#:schema node_modules/wrangler/config-schema.json
# Cloudflare Workers configuration. Deploy with `deno run -A npm:wrangler deploy`
# (or the GitHub Action in .github/workflows/cf-deploy.yml).
# Secrets: `deno run -A npm:wrangler secret put GEMINI_API_KEY` - never put them in this file.
name = "gemini-playground"
main = "src/worker.ts"
compatibility_date = "2025-09-01"

[assets]
directory = "./src/static"
binding = "ASSETS"
not_found_handling = "none"

[observability]
enabled = true
